      <!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hungry Hut Restaurant & Cafe</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
scroll-behavior:smooth;
}

body{
background:#fff8f0;
color:#222;
}

/* HEADER */

header{

background:linear-gradient(135deg,#7a0000,#b30000);

padding:20px;

border-bottom:4px solid gold;

color:white;

}

.header-container{

max-width:1300px;

margin:auto;

display:flex;

justify-content:center;

align-items:center;

gap:20px;

flex-wrap:wrap;

text-align:center;

}

.logo{

width:110px;

height:110px;

object-fit:contain;

background:white;

padding:8px;

border-radius:50%;

}

.brand h1{

font-size:55px;

font-weight:bold;

}

.brand h2{

color:#FFD700;

font-size:24px;

letter-spacing:5px;

margin:8px 0;

}

.menu-tag{

display:inline-block;

padding:10px 22px;

background:white;

color:#8b0000;

border-radius:30px;

font-weight:bold;

}

/* MAIN */

main{

padding:40px 15px;

}

main h3{

text-align:center;

font-size:34px;

color:#8b0000;

margin-bottom:35px;

}

.menu-container{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:25px;

max-width:1400px;

margin:auto;

}

.menu-card{

background:white;

border-radius:15px;

overflow:hidden;

box-shadow:0 8px 20px rgba(0,0,0,.15);

transition:.3s;

}

.menu-card:hover{

transform:translateY(-8px);

}

.menu-card img{

width:100%;

display:block;

}

/* FOOTER */

footer{

margin-top:50px;

background:linear-gradient(135deg,#5c0000,#990000);

color:white;

padding:35px 20px;

border-top:4px solid gold;

}

.footer-container{

max-width:1200px;

margin:auto;

display:flex;

justify-content:space-between;

align-items:center;

flex-wrap:wrap;

gap:30px;

}

.footer-box{

flex:1;

min-width:250px;

}

.footer-box h3{

color:#FFD700;

margin-bottom:10px;

font-size:24px;

}

.footer-box p{

font-size:18px;

line-height:1.8;

}

.phone{

font-size:30px;

font-weight:bold;

color:#FFD700;

}

/* TABLET */

@media(max-width:1024px){

.brand h1{

font-size:42px;

}

.brand h2{

font-size:20px;

}

.menu-container{

grid-template-columns:repeat(2,1fr);

}

.logo{

width:90px;

height:90px;

}

}

/* MOBILE */

@media(max-width:768px){

.header-container{

flex-direction:column;

}

.brand h1{

font-size:34px;

}

.brand h2{

font-size:18px;

letter-spacing:2px;

}

.logo{

width:80px;

height:80px;

}

.menu-tag{

font-size:13px;

padding:8px 15px;

}

main h3{

font-size:26px;

}

.menu-container{

grid-template-columns:1fr;

}

.footer-container{

flex-direction:column;

text-align:center;

}

.phone{

font-size:24px;

}

.footer-box p{

font-size:16px;

}

}

</style>

</head>

<body>

<header>

<div class="header-container">

<img src="logo.png" class="logo" alt="Hungry Hut">

<div class="brand">

<h1>Hungry Hut</h1>

<h2>RESTAURANT & CAFE</h2>

<div class="menu-tag">

TIFFINS • BIRYANI • IRANI CHAI • SNACKS

</div>

</div>

</div>

</header>

<main>

<h3>🍽️ Welcome to Hungry Hut Menu</h3>

<div class="menu-container">

<div class="menu-card">

<img src="Hut.jpeg" alt="Menu Page 1">

</div>

<div class="menu-card">

<img src="Hut1.jpeg" alt="Menu Page 2">

</div>

</div>

</main>

<footer>

<div class="footer-container">

<div class="footer-box">

<h3>📍 Visit Us</h3>

<p>

Near K. R. R. School<br>

Kurnool to Nandyal Road<br>

PANYAM

</p>

</div>

<div class="footer-box">

<h3>📞 Contact</h3>

<p class="phone">

85559 38190<br>

63044 54153

</p>

</div>

</div>

</footer>

</body>

</html>
